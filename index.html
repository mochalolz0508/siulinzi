<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小練字</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#F0F7FF; --paper:#FFFFFF; --ink:#3C3B45; --ink2:#8E8DA0; --line:#E7E9F0;
  --brand:#FF5A5F; --brand-d:#E23B45; --brand2:#FFC800; --brand2-d:#E0A800;
  --ok:#58CC02; --ok-d:#46A302; --ok-bg:#E8FFD4;
  --no:#FF4B4B; --no-d:#E03A3A; --no-bg:#FFE4E4;
  --chi:#FF5A5F; --chi-d:#E23B45; --eng:#1CB0F6; --eng-d:#1493D0; --mat:#58CC02; --mat-d:#46A302;
  --font:'Nunito','Noto Sans TC','PingFang HK',sans-serif;
  --disp:'Fredoka','Nunito','Noto Sans TC',sans-serif;
  --shadow:0 2px 0 rgba(0,0,0,.04),0 8px 22px rgba(60,80,120,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141726; --paper:#1F2338; --ink:#F0F1F8; --ink2:#9A9CB8; --line:#333854;
    --brand:#FF6B70; --brand-d:#C93a44; --brand2:#FFCE33; --brand2-d:#C99C00;
    --ok:#6BD62B; --ok-d:#4b9c10; --ok-bg:#22331A;
    --no:#FF6B6B; --no-d:#c93a3a; --no-bg:#3A2020;
    --chi:#FF6B70; --chi-d:#C93a44; --eng:#4AC0FF; --eng-d:#1a7fb8; --mat:#6BD62B; --mat-d:#4b9c10;
    --shadow:0 2px 0 rgba(0,0,0,.2),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141726; --paper:#1F2338; --ink:#F0F1F8; --ink2:#9A9CB8; --line:#333854;
  --brand:#FF6B70; --brand-d:#C93a44; --brand2:#FFCE33; --brand2-d:#C99C00;
  --ok:#6BD62B; --ok-d:#4b9c10; --ok-bg:#22331A;
  --no:#FF6B6B; --no-d:#c93a3a; --no-bg:#3A2020;
  --chi:#FF6B70; --chi-d:#C93a44; --eng:#4AC0FF; --eng-d:#1a7fb8; --mat:#6BD62B; --mat-d:#4b9c10;
  --shadow:0 2px 0 rgba(0,0,0,.2),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;font-weight:700;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 70px}
header{text-align:center;padding:14px 0 4px}
header .logo{font-family:var(--disp);font-size:34px;font-weight:700;color:var(--brand);letter-spacing:.02em}
header p{color:var(--ink2);font-size:14px;margin-top:4px}
/* 年級 */
.gradebar{display:flex;align-items:center;gap:10px;margin-top:18px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:0 4px 14px rgba(60,80,120,.06)}
.gradebar .gb-label{font-size:14px;color:var(--ink2);font-weight:800}
.gradebar select{margin-left:auto;font:inherit;font-size:16px;font-weight:800;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
/* 星星銀行 */
.starbank{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#FFD84D,#FFB800);color:#7a5200;border:0;border-radius:20px;padding:16px 18px;margin-top:16px;cursor:pointer;box-shadow:0 4px 0 var(--brand2-d),0 8px 18px rgba(255,200,0,.25);width:100%;font:inherit;transition:transform .1s,box-shadow .1s}
.starbank:active{transform:translateY(4px);box-shadow:none}
.starbank .sb-star{font-size:24px}
.starbank .sb-txt{font-size:16px}.starbank .sb-txt b{font-size:22px;font-family:var(--disp)}
.starbank .sb-go{margin-left:auto;font-weight:800;font-size:14px;background:rgba(0,0,0,.12);padding:7px 14px;border-radius:99px}
/* 獎勵店 */
.rw-head{text-align:center;padding:20px 0 6px}
.rw-big{font-size:40px;font-family:var(--disp);font-weight:700;color:var(--brand2)}
.rw-sub{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.reward{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.reward .r-emoji{font-size:26px;flex:none}
.reward .r-nm{font-weight:700;font-size:17px}
.reward .r-cost{font-size:13px;color:var(--brand);font-weight:700}
.reward{border:2px solid var(--line)!important;border-radius:18px!important}
.reward .r-btn{margin-left:auto;flex:none;border:0;border-radius:12px;font:inherit;font-weight:800;padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s}
.reward .r-btn:active{transform:translateY(3px);box-shadow:none}
.reward .r-btn.can{background:var(--ok);color:#fff;box-shadow:0 3px 0 var(--ok-d)}
.reward .r-btn.cant{background:var(--line);color:var(--ink2);cursor:not-allowed}
.reward .r-del{margin-left:6px;flex:none;background:none;border:0;color:var(--ink2);font-size:18px;cursor:pointer;padding:4px}
.rw-add{margin-top:22px;background:var(--paper);border:1px dashed var(--line);border-radius:16px;padding:16px}
.rw-add-title{font-size:14px;color:var(--ink2);margin-bottom:10px}
.rw-add-row{display:flex;gap:8px}
.rw-add-row input{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.rw-add-row input#rwName{flex:1}
.rw-add-row input#rwCost{width:64px;text-align:center}
.rw-add-row button{flex:none;background:var(--brand);color:#fff;border:0;border-radius:10px;font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
.earned{font-size:15px;color:var(--brand);font-weight:700;margin-top:6px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;font-size:15px;font-weight:700;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
/* 科目選擇 */
.subjects{display:grid;gap:14px;margin-top:18px}
.subj{display:flex;align-items:center;gap:16px;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 20px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;box-shadow:0 4px 0 var(--line),0 8px 18px rgba(60,80,120,.07);transition:transform .1s,box-shadow .1s}
.subj:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.subj.chi{border-color:var(--chi)}.subj.chi{box-shadow:0 4px 0 var(--chi-d),0 8px 18px rgba(255,90,95,.14)}
.subj.eng{border-color:var(--eng)}.subj.eng{box-shadow:0 4px 0 var(--eng-d),0 8px 18px rgba(28,176,246,.14)}
.subj.mat{border-color:var(--mat)}.subj.mat{box-shadow:0 4px 0 var(--mat-d),0 8px 18px rgba(88,204,2,.14)}
.subj:active{transform:translateY(4px)!important;box-shadow:none!important}
.subj .icon{flex:none;width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px}
.subj.chi .icon{background:var(--no-bg)}
.subj.eng .icon{background:#DCF2FF}
.subj.mat .icon{background:var(--ok-bg)}
:root[data-theme="dark"] .subj.eng .icon,
:root:not([data-theme="light"]) .subj.eng .icon{background:#22303f}
.subj .nm{font-family:var(--disp);font-size:21px;font-weight:700}
.subj .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.subj .done{margin-left:auto;flex:none;font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--line);color:var(--ink2)}
.subj .done.ok{background:var(--ok-bg);color:var(--ok)}
.dayline{text-align:center;color:var(--ink2);font-size:13px;margin-top:22px}
/* 進度 */
.bar-wrap{display:flex;align-items:center;gap:10px;margin:18px 2px 0}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.bar-txt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.subj-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin:16px 2px 0}
.back{background:none;border:0;color:var(--ink2);font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
/* 卡 */
.card{background:var(--paper);border:2px solid var(--line);border-radius:26px;box-shadow:0 6px 22px rgba(60,80,120,.09);padding:26px 22px;margin-top:12px}
.qtype{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;border-radius:99px;padding:5px 14px;margin-bottom:16px}
.qtext{font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.7;text-wrap:balance}
.qtext .blank{border-bottom:3px solid var(--brand2);padding:0 20px;color:var(--brand)}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:15px 16px;font:inherit;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s,border-color .08s}
.opt:hover:not(:disabled){border-color:var(--eng);box-shadow:0 3px 0 var(--eng-d)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:var(--line);color:var(--ink2);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 3px 0 var(--ok-d)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg);box-shadow:0 3px 0 var(--no-d)}
.opt.wrong .k{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.feedback{margin-top:18px;padding:14px 16px;border-radius:16px;font-size:16px;font-weight:800;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--ok-bg);color:var(--ok-d)}
.feedback.bad{background:var(--no-bg);color:var(--no-d)}
.feedback b{font-weight:900}
.next{margin-top:16px;width:100%;color:#fff;border:0;border-radius:16px;font:inherit;font-size:18px;font-weight:800;letter-spacing:.03em;padding:15px;cursor:pointer;display:none;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.next:active{transform:translateY(4px);box-shadow:none}
.next.show{display:block}
.next.retry{background:var(--brand2);color:#7a5200}
/* 結算 */
.result{text-align:center;padding:30px 22px}
.result .big{font-family:var(--disp);font-size:66px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1}
.result .label{color:var(--ink2);margin-top:6px;font-size:14px}
.result .stars{font-size:38px;letter-spacing:6px;margin:16px 0}
.result .msg{font-family:var(--disp);font-size:22px;font-weight:700;margin:10px 0 4px}
.result .sub{color:var(--ink2);font-size:14px}
.result .btns{display:flex;gap:10px;margin-top:24px}
.result .btns button{flex:1;border:0;border-radius:16px;font:inherit;font-size:16px;font-weight:800;padding:15px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s}
.result .btns button:active{transform:translateY(4px);box-shadow:none}
.b-again{background:var(--line);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.08)!important}
.b-home{color:#fff}
.demo-note{background:var(--brand2);color:#7a5200;text-align:center;font-size:12.5px;letter-spacing:.04em;padding:8px;font-weight:800}
footer{text-align:center;color:var(--ink2);font-size:12px;margin-top:30px;line-height:1.7}
</style>

<div class="demo-note">示範版 · K1 至小六題目按年級調整深淺 · 題庫陸續增加</div>
<div class="wrap">
  <header>
    <div class="logo">小練字</div>
    <p id="subhead">今日練習 · 小一</p>
  </header>

  <!-- 主頁:科目選擇 -->
  <div id="home">
    <div class="gradebar">
      <span class="gb-label">👨‍👩‍👧 年級</span>
      <select id="grade" onchange="setGrade()">
        <optgroup label="幼稚園">
          <option value="K1">K1（幼兒班）</option>
          <option value="K2">K2（低班）</option>
          <option value="K3">K3（高班）</option>
        </optgroup>
        <optgroup label="小學">
          <option value="P1" selected>小一</option>
          <option value="P2">小二</option>
          <option value="P3">小三</option>
          <option value="P4">小四</option>
          <option value="P5">小五</option>
          <option value="P6">小六</option>
        </optgroup>
      </select>
    </div>
    <div class="starbank" onclick="openRewards()">
      <span class="sb-star">⭐</span>
      <span class="sb-txt"><b id="starTotal">0</b> 顆星星</span>
      <span class="sb-go">獎勵 →</span>
    </div>
    <div class="subjects">
      <button class="subj chi" onclick="start('chi')">
        <span class="icon">📖</span>
        <span><span class="nm">中文</span><div class="sub">認字 · 詞語 · 標點 · 20 題</div></span>
        <span class="done" id="done-chi">未做</span>
      </button>
      <button class="subj eng" onclick="start('eng')">
        <span class="icon">🔤</span>
        <span><span class="nm">English</span><div class="sub">Words · Spelling · 20 題</div></span>
        <span class="done" id="done-eng">未做</span>
      </button>
      <button class="subj mat" onclick="start('mat')">
        <span class="icon">🔢</span>
        <span><span class="nm">數學</span><div class="sub">加減 · 數量 · 比較 · 20 題</div></span>
        <span class="done" id="done-mat">未做</span>
      </button>
    </div>
    <div class="dayline" id="dayline"></div>
    <div class="dayline" id="gradeNote" style="margin-top:6px;font-size:12px"></div>
  </div>

  <!-- 做題 -->
  <div id="quizView" style="display:none">
    <button class="back" onclick="goHome()">← 回主頁</button>
    <div class="bar-wrap">
      <div class="bar"><span id="bar" style="width:0%"></span></div>
      <div class="bar-txt" id="barTxt">1 / 20</div>
    </div>
    <div id="quiz"></div>
  </div>

  <!-- 結算 -->
  <div id="resultView" style="display:none">
    <div class="card result">
      <div class="big" id="score">0</div>
      <div class="label" id="scoreLabel">分（滿分 20）</div>
      <div class="stars" id="stars"></div>
      <div class="earned" id="earned"></div>
      <div class="msg" id="rmsg"></div>
      <div class="sub" id="rsub"></div>
      <div class="btns">
        <button class="b-again" onclick="againSame()">再做一次</button>
        <button class="b-home" id="homeBtn" onclick="goHome()">返主頁</button>
      </div>
    </div>
  </div>

  <!-- 獎勵店 -->
  <div id="rewardView" style="display:none">
    <button class="back" onclick="goHome()">← 回主頁</button>
    <div class="rw-head">
      <span class="rw-big">⭐ <b id="starTotal2">0</b></span>
      <span class="rw-sub">你儲的星星</span>
    </div>
    <div id="rewardList"></div>
    <div class="rw-add">
      <div class="rw-add-title">👨‍👩‍👧 家長設定獎勵</div>
      <div class="rw-add-row">
        <input id="rwName" placeholder="獎勵（例:去公園玩）" maxlength="20">
        <input id="rwCost" type="number" placeholder="星" inputmode="numeric" min="1">
        <button onclick="addReward()">加</button>
      </div>
    </div>
  </div>

  <footer>
    示範版本 · 成績只儲喺你自己部機<br>
    正式版可加:每日新題、錯題重溫、家長報告、其他年級
  </footer>
</div>

<script>
const COLORS={chi:"var(--chi)",eng:"var(--eng)",mat:"var(--mat)"};
const NAMES={chi:"中文",eng:"English",mat:"數學"};

const BANK_FALLBACK = {
chi:[
 {t:"看圖識字",q:['☀️ 太陽，寫成哪個字？'],o:["月","日","目","白"],a:1,g:"「日」就是太陽 ☀️",b:"太陽寫成「日」。"},
 {t:"看圖識字",q:['⛰️ 高山，寫成哪個字？'],o:["山","出","土","上"],a:0,g:"「山」有三個尖，像山峰 ⛰️",b:"高山寫成「山」。"},
 {t:"量詞",q:['一','貓'],o:["隻","本","張","架"],a:0,g:"一隻貓 🐱",b:"動物用「隻」。"},
 {t:"量詞",q:['一','書'],o:["隻","本","架","條"],a:1,g:"一本書 📖",b:"書用「本」。"},
 {t:"反義詞",q:['「大」的相反是……'],o:["高","小","圓","長"],a:1,g:"大 ↔ 小",b:"「大」的相反是「小」。"},
 {t:"反義詞",q:['「上」的相反是……'],o:["左","下","前","中"],a:1,g:"上 ↔ 下",b:"上的相反是「下」。"},
 {t:"反義詞",q:['「開」的相反是……'],o:["關","走","坐","站"],a:0,g:"開 ↔ 關",b:"開門、關門。"},
 {t:"填顏色",q:['草地是','色。'],o:["紅","綠","黑","藍"],a:1,g:"草地是綠色 🌿",b:"草是綠色。"},
 {t:"填顏色",q:['天空是','色。'],o:["綠","藍","紅","黃"],a:1,g:"天空是藍色 💙",b:"天空是藍色。"},
 {t:"認字",q:['「口」是身體哪個部位？'],o:["手","眼","嘴巴","腳"],a:2,g:"「口」就是嘴巴 👄",b:"「口」是嘴巴。"},
 {t:"認字",q:['一隻手有多少隻手指？'],o:["三","五","七","十"],a:1,g:"一隻手有五隻手指 ✋",b:"一隻手有五隻手指。"},
 {t:"數量詞",q:['兩','蘋果'],o:["個","隻","本","張"],a:0,g:"兩個蘋果 🍎🍎",b:"蘋果用「個」。"},
 {t:"配對",q:['小朋友睡覺，是甚麼時候？'],o:["早上","晚上","中午","上課"],a:1,g:"晚上才睡覺 🌙",b:"晚上才睡覺。"},
 {t:"配對",q:['下雨要用甚麼？'],o:["雨傘","風扇","眼鏡","鞋"],a:0,g:"下雨用雨傘 ☂️",b:"下雨用雨傘。"},
 {t:"標點",q:['「你好嗎」句尾用……'],o:["。句號","？問號","！感嘆號","，逗號"],a:1,g:"問問題用問號 ？",b:"問人用問號。"},
 {t:"標點",q:['「好開心啊」句尾用……'],o:["。句號","？問號","！感嘆號","，逗號"],a:2,g:"很興奮用感嘆號 ！",b:"開心、興奮用感嘆號。"},
 {t:"部首",q:['「花」字上面是甚麼？'],o:["草花頭","水","火","木"],a:0,g:"「艹」草花頭，和植物有關 🌸",b:"花有草花頭。"},
 {t:"筆順",q:['寫「十」字，先寫……'],o:["直","橫","點","撇"],a:1,g:"先橫後直 ✏️",b:"「十」先寫橫。"},
 {t:"認字",q:['「爸爸」的「爸」，讀……'],o:["ba1(巴)","ma1(媽)","di4(弟)","ge1(哥)"],a:0,g:"爸 = ba1 👨",b:"爸讀 ba1。"},
 {t:"詞語",q:['「小','友」是小朋友。'],o:["朋","明","名","門"],a:0,g:"小朋友 🧒",b:"是「小朋友」。"},
],
eng:[
 {t:"Match",q:['🐱 = ?'],o:["dog","cat","pig","cow"],a:1,g:"🐱 is a cat!",b:"🐱 = cat"},

let cur=null, qlist=[], idx=0, score=0, locked=false;
const TOTAL=20;

// 由獨立題庫檔取題;該年級未有內容就暫用 P1;都冇就用內置後備
function getBank(subject){
  const g=getGrade();
  if(window.QUESTION_BANK){
    if(QUESTION_BANK[g] && QUESTION_BANK[g][subject]) return QUESTION_BANK[g][subject];
    if(QUESTION_BANK.P1 && QUESTION_BANK.P1[subject]) return QUESTION_BANK.P1[subject];
  }
  return BANK_FALLBACK[subject]||[];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ===== 年級 ===== */
const GRADE_NAMES={K1:"K1",K2:"K2",K3:"K3",P1:"小一",P2:"小二",P3:"小三",P4:"小四",P5:"小五",P6:"小六"};
function getGrade(){try{return localStorage.getItem("grade")||"P1"}catch(e){return "P1"}}
function setGrade(){
  const g=document.getElementById("grade").value;
  try{localStorage.setItem("grade",g)}catch(e){}
  updateGradeLabels();
}
function updateGradeLabels(){
  const g=getGrade(), nm=GRADE_NAMES[g];
  document.getElementById("subhead").textContent="今日練習 · "+nm;
  const note=document.getElementById("gradeNote");
  if(note){
    const has=window.QUESTION_BANK && QUESTION_BANK[g];
    const n=has?(QUESTION_BANK[g].chi.length):0;
    note.textContent = has
      ? "已選 "+nm+" · 題目會按年級調整深淺（示範題庫，陸續增加）"
      : nm+"：題庫製作中，暫用小一題目";

/* ===== 星星銀行 ===== */
function getStars(){try{return parseInt(localStorage.getItem("stars")||"0",10)||0}catch(e){return 0}}
function setStars(n){try{localStorage.setItem("stars",n)}catch(e){}; renderStars();}
function renderStars(){
  const n=getStars();
  document.getElementById("starTotal").textContent=n;
  const t2=document.getElementById("starTotal2"); if(t2)t2.textContent=n;
}
const DEFAULT_REWARDS=[
  {emoji:"🍦",name:"吃雪糕",cost:15},
  {emoji:"📺",name:"看 30 分鐘卡通",cost:20},
  {emoji:"🏞️",name:"去公園玩",cost:40},
];
function getRewards(){
  try{const v=localStorage.getItem("rewards"); if(v)return JSON.parse(v);}catch(e){}
  return DEFAULT_REWARDS.slice();
}
function saveRewards(r){try{localStorage.setItem("rewards",JSON.stringify(r))}catch(e){}}
const EMOJIS=["🎁","🍦","🍫","📺","🎮","🏞️","🧸","🚲","🍕","🎨"];
function addReward(){
  const nm=document.getElementById("rwName").value.trim();
  const cost=parseInt(document.getElementById("rwCost").value,10);
  if(!nm||!cost||cost<1){toast("請填獎勵和星數");return;}
  const r=getRewards();
  r.push({emoji:EMOJIS[r.length%EMOJIS.length],name:nm,cost:cost});
  saveRewards(r);
  document.getElementById("rwName").value="";document.getElementById("rwCost").value="";
  renderRewards();
}
function delReward(i){const r=getRewards();r.splice(i,1);saveRewards(r);renderRewards();}
function redeem(i){
  const r=getRewards(),n=getStars();
  if(n<r[i].cost){toast("星星不夠，再多練習！");return;}
  setStars(n-r[i].cost);
  toast("換到「"+r[i].name+"」了 🎉");
  renderRewards();
}
function renderRewards(){
  renderStars();
  const n=getStars(), r=getRewards();
  document.getElementById("rewardList").innerHTML=r.map((x,i)=>
    `<div class="reward">
      <span class="r-emoji">${x.emoji}</span>
      <span><span class="r-nm">${x.name}</span><br><span class="r-cost">⭐ ${x.cost} 顆</span></span>
      <button class="r-btn ${n>=x.cost?'can':'cant'}" onclick="redeem(${i})">${n>=x.cost?'兌換':'不夠'}</button>
      <button class="r-del" onclick="delReward(${i})">🗑️</button>
    </div>`).join("")||'<p style="text-align:center;color:var(--ink2);margin-top:20px">未有獎勵，在下面加一個 👇</p>';
}
function openRewards(){
  document.getElementById("home").style.display="none";
  document.getElementById("rewardView").style.display="block";

}
let toastTimer;

// 數學按年級自動生成整份題目(示範「分級＋自動出題」)
function genMathSet(grade,n){
  const cfg={
    K1:{max:5,ops:["加","數"]}, K2:{max:5,ops:["加","數"]}, K3:{max:10,ops:["加","減","數"]},
    P1:{max:20,ops:["加","減","比"]}, P2:{max:100,ops:["加","減","比"]},
    P3:{max:1000,ops:["加","減","乘"]}, P4:{max:1000,ops:["加","減","乘","除"]},
    P5:{max:10000,ops:["加","減","乘","除"]}, P6:{max:100000,ops:["加","減","乘","除"]},
  }[grade]||{max:20,ops:["加","減"]};
  const r=(x)=>Math.floor(pickSeed()*x);
  const mkOpt=(ans)=>{const s=new Set([ans]);let g=0;
    while(s.size<4&&g++<40){let d=ans+(r(Math.max(5,Math.floor(ans*0.2)+3))-2);if(d>=0&&d!==ans)s.add(d);}
    while(s.size<4)s.add(ans+s.size);
    const arr=[...s].sort(()=>pickSeed()-.5);return{o:arr.map(String),a:arr.indexOf(ans)};};
  const out=[];
  for(let i=0;i<n;i++){
    const op=cfg.ops[r(cfg.ops.length)];
    if(op==="數"){const c=r(Math.min(cfg.max,6))+2;const O=mkOpt(c);
      out.push({t:"數數",q:["🍎".repeat(c)+" 有多少個？"],o:O.o,a:O.a,g:c+" 個",b:"數一數："+c+" 個。"});}
    else if(op==="加"){const a=r(cfg.max),b=r(cfg.max-a>0?cfg.max-a:1),ans=a+b;const O=mkOpt(ans);
      out.push({t:"加法",q:[`${a} + ${b} = ?`],o:O.o,a:O.a,g:`${a} + ${b} = ${ans}`,b:`${a} 加 ${b} 等於 ${ans}。`});}
    else if(op==="減"){const a=r(cfg.max)+1,b=r(a+1),ans=a-b;const O=mkOpt(ans);
      out.push({t:"減法",q:[`${a} - ${b} = ?`],o:O.o,a:O.a,g:`${a} - ${b} = ${ans}`,b:`${a} 減 ${b} 等於 ${ans}。`});}
    else if(op==="乘"){const a=r(9)+1,b=r(9)+1,ans=a*b;const O=mkOpt(ans);
      out.push({t:"乘法",q:[`${a} × ${b} = ?`],o:O.o,a:O.a,g:`${a} × ${b} = ${ans}`,b:`${a} 乘 ${b} 等於 ${ans}。`});}
    else if(op==="除"){const b=r(9)+1,ans=r(9)+1,a=b*ans;const O=mkOpt(ans);
      out.push({t:"除法",q:[`${a} ÷ ${b} = ?`],o:O.o,a:O.a,g:`${a} ÷ ${b} = ${ans}`,b:`${a} 除以 ${b} 等於 ${ans}。`});}
    else{const a=r(cfg.max),b=r(cfg.max);const ans=a>b?">":a<b?"<":"=";const O={o:[">","<","="],a:[">","<","="].indexOf(ans)};
      out.push({t:"比較",q:[`${a} __ ${b} 中間填……`],o:O.o,a:O.a,g:`${a} ${ans} ${b}`,b:`${a} ${ans} ${b}。`});}
  }
  return out;
}

function start(s){
  cur=s; idx=0; score=0; locked=false;
  if(s==="mat") qlist=genMathSet(getGrade(),TOTAL);
  else qlist=shuffle(getBank(s)).slice(0,TOTAL);
  document.getElementById("home").style.display="none";
  document.getElementById("resultView").style.display="none";
  document.getElementById("quizView").style.display="block";
  document.getElementById("subhead").textContent="今日練習 · "+GRADE_NAMES[getGrade()]+" · "+NAMES[s];
  document.getElementById("bar").style.background=
    "linear-gradient(90deg,var(--brand2),"+COLORS[s]+")";
  render();
}

function render(){
  const q=qlist[idx];
  document.getElementById("bar").style.width=(idx/qlist.length*100)+"%";
  document.getElementById("barTxt").textContent=(idx+1)+" / "+qlist.length;
  const qhtml=q.q.length>1?`${q.q[0]}<span class="blank">?</span>${q.q[1]}`:q.q[0];
  const opts=q.o.map((o,i)=>
    `<button class="opt" onclick="pick(${i})"><span class="k">${"ABCD"[i]}</span><span>${o}</span></button>`).join("");
  document.getElementById("quiz").innerHTML=
    `<div class="card">
       <span class="qtype" style="color:${COLORS[cur]};background:var(--no-bg)">${q.t}</span>
       <div class="qtext">${qhtml}</div>
       <div class="opts" id="opts">${opts}</div>
       <div class="feedback" id="fb"></div>
       <button class="next retry" id="retryBtn" onclick="doRetry()">🔁 再試一題</button>
       <button class="next" id="nextBtn" style="background:${COLORS[cur]}" onclick="next()">${idx<qlist.length-1?"下一題 →":"看成績 →"}</button>
     </div>`;
  locked=false;
}

function pick(i){
  if(locked)return; locked=true;
  const q=qlist[idx];
  const btns=[...document.querySelectorAll("#opts .opt")];
  btns.forEach(b=>b.disabled=true);
  const fb=document.getElementById("fb");
  if(i===q.a){
    score++;btns[i].classList.add("correct");
    fb.className="feedback good show";fb.innerHTML=`<b>答對了！</b> ${q.g}　⭐ 過關！`;
    document.getElementById("nextBtn").classList.add("show");
  }else{
    // 精熟闖關:錯咗先教,再換一條類似題試過
    btns[i].classList.add("wrong");btns[q.a].classList.add("correct");
    fb.className="feedback bad show";
    fb.innerHTML=`<b>再想想</b> ${q.b}　正確答案：<b>${q.o[q.a]}</b>`;
    const rb=document.getElementById("retryBtn");
    rb.classList.add("show");
  }
}

// 換一條「類似題」— 數學自動生成,中英文抽同類型
function similarQuestion(q){
  if(cur==="mat"){
    const gen=genMath(q.t); if(gen) return gen;
  }
  const pool=getBank(cur).filter(x=>x.t===q.t && x.q.join()!==q.q.join());
  if(pool.length) return pool[Math.floor(pickSeed()*pool.length)];
  return null;
}
let seedN=1;
function pickSeed(){seedN=(seedN*9301+49297)%233280;return seedN/233280;}
function genMath(type){
  const r=(n)=>Math.floor(pickSeed()*n);
  function opts(ans){
    const s=new Set([ans]);
    while(s.size<4){let d=ans+(r(5)-2);if(d>=0)s.add(d);}
    const arr=[...s].sort(()=>pickSeed()-.5);
    return {o:arr.map(String),a:arr.indexOf(ans)};
  }
  if(type==="加法"){const a=r(6),b=r(6),ans=a+b;const O=opts(ans);
    return {t:"加法",q:[`${a} + ${b} = ?`],o:O.o,a:O.a,g:`${a} + ${b} = ${ans}`,b:`${a} 加 ${b} 等於 ${ans}。`};}
  if(type==="減法"){const a=r(10)+1,b=r(a+1),ans=a-b;const O=opts(ans);
    return {t:"減法",q:[`${a} - ${b} = ?`],o:O.o,a:O.a,g:`${a} - ${b} = ${ans}`,b:`${a} 減 ${b} 等於 ${ans}。`};}
  return null;
}

let retryQ=null;
function doRetry(){
  const q=qlist[idx];
  retryQ=similarQuestion(q);
  document.getElementById("retryBtn").classList.remove("show");
  if(!retryQ){ // 冇類似題就直接過
    document.getElementById("nextBtn").classList.add("show"); return;
  }
  const opts=retryQ.o.map((o,i)=>
    `<button class="opt" onclick="pickRetry(${i})"><span class="k">${"ABCD"[i]}</span><span>${o}</span></button>`).join("");
  document.getElementById("quiz").innerHTML=
    `<div class="card">
       <span class="qtype" style="color:#8A6A1F;background:var(--no-bg)">🔁 再試一題（類似）</span>
       <div class="qtext">${retryQ.q.length>1?`${retryQ.q[0]}<span class="blank">?</span>${retryQ.q[1]}`:retryQ.q[0]}</div>
       <div class="opts" id="opts">${opts}</div>
       <div class="feedback" id="fb"></div>
       <button class="next" id="nextBtn" style="background:${COLORS[cur]}" onclick="next()">${idx<qlist.length-1?"下一題 →":"看成績 →"}</button>
     </div>`;
  locked=false;
}
function pickRetry(i){
  if(locked)return;locked=true;
  const btns=[...document.querySelectorAll("#opts .opt")];
  btns.forEach(b=>b.disabled=true);
  const fb=document.getElementById("fb");
  if(i===retryQ.a){btns[i].classList.add("correct");
    fb.className="feedback good show";fb.innerHTML=`<b>學會了！</b> ${retryQ.g}　⭐ 過關！`;}
  else{btns[i].classList.add("wrong");btns[retryQ.a].classList.add("correct");
    fb.className="feedback bad show";fb.innerHTML=`不要緊，慢慢來 💪　答案：<b>${retryQ.o[retryQ.a]}</b>`;}
  document.getElementById("nextBtn").classList.add("show");
}

function next(){idx++; if(idx<qlist.length)render(); else showResult();}

function showResult(){
  document.getElementById("quizView").style.display="none";
  document.getElementById("resultView").style.display="block";
  document.getElementById("score").textContent=score;
  document.getElementById("scoreLabel").textContent="分（滿分 "+qlist.length+"）· "+NAMES[cur];
  const pct=score/qlist.length, n=Math.max(1,Math.round(pct*3));
  document.getElementById("stars").textContent="⭐".repeat(n)+"☆".repeat(3-n);
  let m,s;
  if(pct===1){m="滿分！好厲害 🎉";s="全部答對，繼續保持！";}
  else if(pct>=0.75){m="做得很好 👏";s="差一點就滿分！";}
  else if(pct>=0.5){m="不錯喔 🙂";s="答錯的，再看一次就記得。";}
  else{m="繼續努力 💪";s="慢慢來，多練幾次一定進步。";}
  document.getElementById("rmsg").textContent=m;
  document.getElementById("rsub").textContent=s;
  // 賺星星:每答對一題 = 1 顆星,滿分額外獎 3 顆
  let earn=score+(pct===1?3:0);
  setStars(getStars()+earn);
  document.getElementById("earned").textContent=
    "⭐ 獲得 "+earn+" 顆星星"+(pct===1?"（滿分獎 +3！）":"");
  try{localStorage.setItem("done-"+cur,score)}catch(e){}
}

function againSame(){start(cur);}
function goHome(){
  document.getElementById("quizView").style.display="none";
  document.getElementById("resultView").style.display="none";
  document.getElementById("rewardView").style.display="none";
  document.getElementById("home").style.display="block";
  updateGradeLabels();
  loadDone();
}

document.getElementById("grade").value=getGrade();
updateGradeLabels();
loadDone();
renderStars();
</script>
